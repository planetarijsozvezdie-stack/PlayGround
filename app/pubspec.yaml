name: planetarium_manager
description: "Планетарий Менеджер — управление выездным планетарием."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  intl: ^0.20.2
  path: ^1.9.0
  path_provider: ^2.1.5
  pdf: ^3.11.3
  sqflite: ^2.4.2
  timezone: ^0.10.1
  uuid: ^4.5.1
  excel: ^4.0.6
  web: ^1.1.1
  file_picker: ^13.1.0
  crypto: ^3.0.7
  flutter_local_notifications: ^20.1.0
  local_auth: ^3.0.2
  sqflite_sqlcipher: ^3.4.1
  flutter_secure_storage: ^11.2.0
  open_filex: ^5.0.0
  cryptography: ^2.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.3.4

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/DejaVuSans.ttf
    - assets/fonts/DejaVuSans-Bold.ttf
